<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Point Property Services • Documento en Línea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Cinzel', 'serif'] },
                    colors: {
                        forest: { 800: '#16382b', 900: '#0d231b', 950: '#07140f' },
                        gold: { 100: '#fbf5e0', 200: '#f5e6b8', 400: '#e2c055', 500: '#d4af37', 600: '#b89225', 700: '#947218' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen py-8 px-4">

    <!-- CONTENEDOR PRINCIPAL DE LA FACTURA -->
    <main id="invoice-container" class="max-w-3xl mx-auto bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden p-6 sm:p-10 space-y-8">
        <!-- Estado de carga inicial -->
        <div id="loading-state" class="text-center py-20 space-y-4">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-forest-900"></i>
            <p class="text-sm font-bold text-slate-500">Cargando documento...</p>
        </div>
    </main>

    <script>
        const API_URL = "https://elite-api.mtua3458.workers.dev"; // Reemplaza con la URL de tu Worker si es distinta

        async function loadDocument() {
            const urlParams = new URLSearchParams(window.location.search);
            const docNum = urlParams.get('doc');
            const container = document.getElementById('invoice-container');

            if (!docNum) {
                container.innerHTML = `
                    <div class="text-center py-16 space-y-3">
                        <i class="fa-solid fa-triangle-exclamation text-4xl text-amber-500"></i>
                        <h2 class="text-lg font-bold text-forest-900">Documento no especificado</h2>
                        <p class="text-xs text-slate-500">Por favor, asegúrate de abrir el enlace correcto enviado por Elite Point Property Services.</p>
                    </div>
                `;
                return;
            }

            // 1. Intentar buscar en el almacenamiento local primero (si el usuario lo abrió en el mismo navegador)
            let docData = null;
            const localStored = localStorage.getItem(`elite_doc_${docNum}`);
            if (localStored) {
                try { docData = JSON.parse(localStored); } catch(e){}
            }

            // 2. Si no está local, consultarlo al Worker de Cloudflare KV
            if (!docData) {
                try {
                    const response = await fetch(`${API_URL}/?doc=${docNum}`);
                    if (response.ok) {
                        docData = await response.json();
                    }
                } catch (err) {
                    console.error("Error conectando con la API:", err);
                }
            }

            if (!docData) {
                container.innerHTML = `
                    <div class="text-center py-16 space-y-3">
                        <i class="fa-solid fa-file-circle-xmark text-4xl text-red-500"></i>
                        <h2 class="text-lg font-bold text-forest-900">Documento no encontrado</h2>
                        <p class="text-xs text-slate-500">No pudimos encontrar el registro #${docNum} en nuestros servidores.</p>
                    </div>
                `;
                return;
            }

            renderInvoiceView(docData);
        }

        function renderInvoiceView(doc) {
            const container = document.getElementById('invoice-container');
            
            // Cálculos de totales
            let matSub = 0, laborSub = 0;
            let itemsHTML = '';

            if (doc.items) {
                doc.items.forEach((item, idx) => {
                    let serviceTitle = doc.serviceOptions ? doc.serviceOptions[item.serviceIndex] : "Service";
                    if (item.serviceIndex === (doc.serviceOptions ? doc.serviceOptions.length - 1 : 6) && item.customService) {
                        serviceTitle = item.customService;
                    }

                    laborSub += (item.laborRate || 0);

                    let materialsRows = '';
                    if (item.materials) {
                        item.materials.forEach(mat => {
                            let matName = doc.materialOptions ? doc.materialOptions[mat.materialIndex] : "Material";
                            if (mat.materialIndex === (doc.materialOptions ? doc.materialOptions.length - 1 : 7) && mat.customMaterial) {
                                matName = mat.customMaterial;
                            }
                            let q = parseFloat(mat.qty) || 1;
                            let sub = q * (mat.rate || 0);
                            matSub += sub;

                            materialsRows += `
                                <div class="flex justify-between items-center text-xs py-1.5 pl-4 border-l-2 border-gold-500/40">
                                    <span class="text-slate-600">${matName} (Cant: ${mat.qty})</span>
                                    <span class="font-bold text-slate-800">$${sub.toFixed(2)}</span>
                                </div>
                            `;
                        });
                    }

                    itemsHTML += `
                        <div class="space-y-2 py-3 border-b border-slate-100">
                            <div class="flex justify-between font-bold text-sm text-forest-900">
                                <span>${idx + 1}. ${serviceTitle}</span>
                                <span>$${(item.laborRate || 0).toFixed(2)} (Labor)</span>
                            </div>
                            <div class="space-y-1">${materialsRows}</div>
                        </div>
                    `;
                });
            }

            let tax = matSub * 0.07;
            let grandTotal = matSub + tax + laborSub;
            const docTypeLabel = doc.type === 'estimate' ? 'PRESUPUESTO (ESTIMATE)' : 'FACTURA (INVOICE)';

            // Botón de pago (Stripe) si está configurado
            let paymentLinks = JSON.parse(localStorage.getItem('elite_pay_links') || '[]');
            let stripeLink = doc.paymentLink || (paymentLinks.length > 0 ? paymentLinks[0].url : '#');

            container.innerHTML = `
                <!-- Cabecera del Documento -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-200 pb-6">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="px-3 py-1 bg-forest-900 text-gold-400 text-xs font-extrabold rounded-full uppercase">${docTypeLabel}</span>
                            <span class="text-xs font-bold text-slate-400">#${doc.number}</span>
                        </div>
                        <h1 class="font-display font-bold text-xl text-forest-900">Elite Point Property Services</h1>
                    </div>
                    <div class="text-right sm:text-right w-full sm:w-auto">
                        <p class="text-xs font-bold text-slate-500">Fecha de Emisión: <span class="text-slate-800">${doc.date || 'N/A'}</span></p>
                        <p class="text-xs font-bold text-slate-500">Vencimiento / Términos: <span class="text-slate-800">${doc.dueDate || doc.terms || 'Due on Receipt'}</span></p>
                    </div>
                </div>

                <!-- Información del Cliente -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-200">
                    <div>
                        <h3 class="text-xs font-extrabold text-forest-900 uppercase mb-1">Cliente:</h3>
                        <p class="text-sm font-bold text-slate-800">${doc.clientName}</p>
                        <p class="text-xs text-slate-600">${doc.clientEmail || ''}</p>
                        <p class="text-xs text-slate-600">${doc.clientPhone ? `+1 ${doc.clientPhone}` : ''}</p>
                    </div>
                    <div>
                        <h3 class="text-xs font-extrabold text-forest-900 uppercase mb-1">Dirección de la Propiedad:</h3>
                        <p class="text-xs text-slate-700 font-medium">${doc.clientAddress || 'No especificada'}</p>
                    </div>
                </div>

                <!-- Foto de la propiedad (Si aplica en Estimate) -->
                ${doc.housePhoto ? `
                    <div class="space-y-2">
                        <h3 class="text-xs font-extrabold text-forest-900 uppercase">Propiedad / Alcance visual:</h3>
                        <img src="${doc.housePhoto}" class="max-h-60 rounded-xl border border-slate-200 object-contain mx-auto bg-slate-50 p-2" alt="Property">
                        ${doc.houseCaption ? `<p class="text-xs text-slate-600 italic text-center">${doc.houseCaption}</p>` : ''}
                    </div>
                ` : ''}

                <!-- Detalle de Servicios y Materiales -->
                <div class="space-y-3">
                    <h3 class="text-xs font-extrabold text-forest-900 uppercase border-b border-slate-200 pb-2">Desglose de Servicios y Materiales</h3>
                    <div class="space-y-2">${itemsHTML}</div>
                </div>

                <!-- Resumen Financiero -->
                <div class="bg-forest-950 text-white p-6 rounded-2xl space-y-2 shadow-inner">
                    <div class="flex justify-between text-xs text-slate-300">
                        <span>Subtotal Materiales:</span>
                        <span>$${matSub.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between text-xs text-slate-300">
                        <span>Impuestos (7%):</span>
                        <span>$${tax.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between text-xs text-slate-300">
                        <span>Mano de Obra (Labor):</span>
                        <span>$${laborSub.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between text-base font-extrabold text-gold-400 pt-3 border-t border-forest-800">
                        <span>Total General:</span>
                        <span>$${grandTotal.toFixed(2)}</span>
                    </div>
                </div>

                <!-- Botones de Acción para el Cliente -->
                <div class="flex flex-col sm:flex-row gap-3 pt-4">
                    <a href="${stripeLink}" target="_blank" class="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-xl text-xs text-center transition-all shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-credit-card"></i> Pagar con Tarjeta (Stripe)
                    </a>
                    <button onclick="window.print()" class="px-5 py-3.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-extrabold rounded-xl text-xs transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-print"></i> Imprimir / Guardar PDF
                    </button>
                </div>
            `;
        }

        loadDocument();
    </script>
</body>
</html>
